[package]
name = "sqlite-cms"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
base64 = "0.23"
blake3 = "1"
mime_guess = "2"
rusqlite = { version = "0.37", features = ["bundled", "serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
toml = "1"
ureq = "3"

[dev-dependencies]
tempfile = "3"

