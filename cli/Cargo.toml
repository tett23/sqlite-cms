[package]
name = "sqlite-cms"
version = "0.0.1"
edition = "2021"

[dependencies]
anyhow = "1"
blake3 = "1"
rusqlite = { version = "0.40", features = ["bundled", "serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
