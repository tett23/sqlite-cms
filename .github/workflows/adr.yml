name: adr

# コミット済みの ADR が、ステータスの行のほかで書き換えられていないかを adr-guard で調べる（ADR 0064）。
# ci.yml と違い、ドキュメントだけの変更でも動かす。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  adr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 範囲の中のすべてのコミットを読むので、履歴をすべて取る。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # ステータスの行の変更と、ADR の参照のリンクだけを変える書き換えは許し、check-range の後に、リンクのない参照と、ステータスの行がちょうど 1 つあることも調べる（ADR 0068、0069、0072、0073）。
      - uses: tett23/adr-guard@v0.8.1
        with:
          allow-status: true
          allow-links: true
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
