name: ci

# ワークフローは常に動かし、表示に関わらない変更ではジョブを飛ばす（ADR 0070）。
# ワークフローごと動かさないと、マージの条件にした検査（ci-result）が報告されず、PR をマージできなくなる。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 変わったファイルから、test と browser のジョブが要るかを決める（ADR 0070）。
  # 文書と開発の手順だけなら、どちらも飛ばす。テストだけなら、browser を飛ばす。
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      test: ${{ steps.needs.outputs.test }}
      browser: ${{ steps.needs.outputs.browser }}
    steps:
      # 差分を取るため、履歴をすべて取る。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - run: sh .github/scripts/test-ci-needs.sh

      - id: needs
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        # 差分を取れないとき（前のコミットがない、履歴にない）は、一覧を空にして、どちらも要るとみなす。
        run: |
          files=$(git diff --name-only "$BASE...$HEAD" 2>/dev/null) || files=""
          echo "変わったファイル:"
          printf '%s\n' "$files"
          echo "test=$(printf '%s\n' "$files" | sh .github/scripts/ci-needs.sh test)" >> "$GITHUB_OUTPUT"
          echo "browser=$(printf '%s\n' "$files" | sh .github/scripts/ci-needs.sh browser)" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  # 一つのジョブで順に行う。Rust のテストは埋め込んだ SPA を使うので、ジョブを分けても SPA のビルドを待つことになり、
  # ジョブごとのセットアップの分だけかえって遅くなる（ADR 0044）。速く終わる検査を先に置き、失敗を早く知らせる。
  test:
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm test
        working-directory: web

      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

      # cargo test が作った CLI（target/debug/sqlite-cms）を、ブラウザの検査のジョブに渡す（ADR 0052）。
      - uses: actions/upload-artifact@v7
        with:
          name: sqlite-cms-debug
          path: target/debug/sqlite-cms
          retention-days: 1

  # E2E、Lighthouse、Core Web Vitals を、別々の機械で並行して行う（ADR 0052）。
  # 一つの機械で順に行うと 3 分かかっていた。Core Web Vitals は、ページを二つに分けて計測する。
  # 別々の機械なので、CPU を取り合って INP や LCP が揺れることもない。
  browser:
    needs: [changes, test]
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # どれかが失敗しても、ほかの検査の結果とレポートを残す。
      fail-fast: false
      matrix:
        include:
          - name: E2E
            script: e2e
          - name: Lighthouse
            script: lighthouse
            reports: lighthouse-reports
            artifact: lighthouse-reports
          - name: Core Web Vitals 1/2
            script: web-vitals
            shard: 1/2
            reports: web-vitals-reports
            artifact: web-vitals-reports-1
          - name: Core Web Vitals 2/2
            script: web-vitals
            shard: 2/2
            reports: web-vitals-reports
            artifact: web-vitals-reports-2
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - uses: actions/download-artifact@v8
        with:
          name: sqlite-cms-debug
          path: bin
      - run: chmod +x bin/sqlite-cms

      - name: ${{ matrix.name }}
        timeout-minutes: 6
        run: npm run ${{ matrix.script }}
        working-directory: web
        env:
          SQLITE_CMS_BIN: ${{ github.workspace }}/bin/sqlite-cms
          # Lighthouse は、ページを分けて 3 つの Chrome で並行して計測する。パフォーマンスの点数は揺れるが、記録するだけなので許す。
          LIGHTHOUSE_CONCURRENCY: 3
          WEB_VITALS_SHARD: ${{ matrix.shard }}

      - uses: actions/upload-artifact@v7
        if: always() && matrix.reports
        with:
          name: ${{ matrix.artifact }}
          path: web/${{ matrix.reports }}
          if-no-files-found: ignore

  # マージの条件にする検査（ADR 0070）。飛ばしたジョブは通過とみなし、失敗か取り消しがあれば失敗する。
  # browser は matrix なので、飛ばすと検査の名前（E2E など）が報告されない。必須の検査は、このジョブ一つにまとめる。
  ci-result:
    needs: [changes, test, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          TEST: ${{ needs.test.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          echo "changes=$CHANGES test=$TEST browser=$BROWSER"
          [ "$CHANGES" = success ] || exit 1
          for result in "$TEST" "$BROWSER"; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
