name: release

on:
  push:
    tags: ["v*"]
  # タグなしの手動実行では、ビルドと梱包だけを試し、Release は作らない。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

      - run: cargo test --release
      - run: cargo build --release --target ${{ matrix.target }}

      - name: Lighthouse
        if: matrix.os == 'ubuntu-latest'
        run: npm run lighthouse
        working-directory: web
        env:
          SQLITE_CMS_BIN: ${{ github.workspace }}/target/${{ matrix.target }}/release/sqlite-cms

      - uses: actions/upload-artifact@v7
        if: always() && matrix.os == 'ubuntu-latest'
        with:
          name: lighthouse-reports
          path: web/lighthouse-reports
          if-no-files-found: ignore

      - name: Package
        run: tar -czf sqlite-cms-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release sqlite-cms

      - uses: actions/upload-artifact@v7
        with:
          name: sqlite-cms-${{ matrix.target }}
          path: sqlite-cms-${{ matrix.target }}.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes sqlite-cms-*.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}
