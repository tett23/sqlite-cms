# 記事リポジトリに置く公開用のワークフローの雛形。
# このリポジトリ（sqlite-cms）の中では動かない。記事リポジトリの .github/workflows/ にコピーして使う。
#
# 記事リポジトリに設定するもの:
#   シークレット CLOUDFLARE_API_TOKEN   Workers を編集できる API トークン
#   シークレット CLOUDFLARE_ACCOUNT_ID  Cloudflare のアカウント ID
#   site.toml の [deploy] worker       公開先の Worker 名
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install sqlite-cms
        run: |
          gh release download --repo tett23/sqlite-cms --pattern 'sqlite-cms-x86_64-unknown-linux-gnu.tar.gz' --output - | tar -xz
        env:
          GH_TOKEN: ${{ github.token }}

      - run: ./sqlite-cms deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
