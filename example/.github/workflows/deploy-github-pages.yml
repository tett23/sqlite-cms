# 記事リポジトリを GitHub Pages に公開するワークフローの雛形。
# このリポジトリ（sqlite-cms）の中では動かない。記事リポジトリの .github/workflows/ にコピーして使う。
#
# 記事リポジトリに設定するもの:
#   site.toml の [deploy] target = "github-pages"
#   site.toml の base_path = "/<リポジトリ名>/"（https://<user>.github.io/<リポジトリ名>/ で公開するとき）
#   リポジトリの Settings → Pages で、公開元を gh-pages ブランチの / (root) にする（初めて公開した後）
name: deploy-github-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# gh-pages ブランチに push するために、書き込みの権限が要る。
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install sqlite-cms
        run: |
          gh release download --repo tett23/sqlite-cms --pattern 'sqlite-cms-x86_64-unknown-linux-gnu.tar.gz' --output - | tar -xz
        env:
          GH_TOKEN: ${{ github.token }}

      - run: ./sqlite-cms deploy
