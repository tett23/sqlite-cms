<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" font-family="sans-serif">
  <title>白地に黒い文字と青い下線のリンクだけの、古いウェブサイトのようなページを表示したブラウザ</title>
  <rect width="480" height="300" fill="#f5f5f5"/>
  <!-- ブラウザの枠 -->
  <rect x="24.5" y="20.5" width="431" height="259" rx="6" fill="#ffffff" stroke="#999999"/>
  <path d="M25 48.5 H455" stroke="#999999"/>
  <circle cx="42" cy="34.5" r="5" fill="#dddddd" stroke="#999999"/>
  <circle cx="58" cy="34.5" r="5" fill="#dddddd" stroke="#999999"/>
  <circle cx="74" cy="34.5" r="5" fill="#dddddd" stroke="#999999"/>
  <rect x="96.5" y="27.5" width="300" height="14" rx="7" fill="#f5f5f5" stroke="#cccccc"/>
  <text x="108" y="38" font-size="9" fill="#555555">https://example.workers.dev/</text>
  <!-- ヘッダ -->
  <text x="56" y="80" font-size="15" font-weight="bold" fill="#000000">tett23の記事置き場</text>
  <text x="352" y="79" font-size="10" fill="#0000ee" text-decoration="underline">トップ</text>
  <text x="392" y="79" font-size="10" fill="#0000ee" text-decoration="underline">自己紹介</text>
  <path d="M56 90.5 H424" stroke="#999999"/>
  <!-- 本文 -->
  <rect x="56" y="106" width="300" height="6" rx="3" fill="#333333"/>
  <rect x="56" y="120" width="246" height="6" rx="3" fill="#333333"/>
  <text x="56" y="150" font-size="12" font-weight="bold" fill="#000000">記事</text>
  <g fill="#0000ee">
    <rect x="56" y="162" width="110" height="5" rx="2"/>
    <rect x="56" y="186" width="84" height="5" rx="2"/>
    <rect x="56" y="210" width="128" height="5" rx="2"/>
  </g>
  <g fill="#999999">
    <rect x="176" y="162" width="46" height="5" rx="2"/>
    <rect x="150" y="186" width="46" height="5" rx="2"/>
    <rect x="194" y="210" width="46" height="5" rx="2"/>
    <rect x="56" y="171" width="220" height="4" rx="2"/>
    <rect x="56" y="195" width="190" height="4" rx="2"/>
    <rect x="56" y="219" width="236" height="4" rx="2"/>
  </g>
  <!-- コードブロック -->
  <rect x="300.5" y="140.5" width="124" height="84" fill="#f5f5f5" stroke="#dddddd"/>
  <g font-family="monospace" font-size="8.5">
    <text x="309" y="157" fill="#a0111f">fn</text>
    <text x="323" y="157" fill="#622cbc">main</text>
    <text x="345" y="157" fill="#0e1116">() {</text>
    <text x="318" y="171" fill="#0e1116">println!(</text>
    <text x="318" y="185" fill="#032563">  "こんにちは"</text>
    <text x="318" y="199" fill="#0e1116">);</text>
    <text x="309" y="213" fill="#0e1116">}</text>
  </g>
  <!-- フッター -->
  <path d="M56 244.5 H424" stroke="#dddddd"/>
  <text x="56" y="261" font-size="9" fill="#555555">ライセンス: <tspan fill="#0000ee" text-decoration="underline">CC0 1.0</tspan></text>
</svg>
